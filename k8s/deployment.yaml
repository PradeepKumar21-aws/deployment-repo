apiVersion: apps/v1
kind: Deployment
metadata:
  name: mypod
  labels:
    app: mypod

spec:
  replicas: 3

  selector:
    matchLabels:
      app: mypod

  template:
    metadata:
      labels:
        app: mypod

    spec:
      containers:
        - name: cont1
          image: pradeep211031/employee-attendance-tracker:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
